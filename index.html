<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roaring Fork Watershed Directory</title>

  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- PMTiles - reads the self-hosted basemap archive directly via HTTP range
       requests, no tile server. Replaces raw OpenStreetMap raster tiles,
       which OSM's own usage policy asks production sites not to hotlink. -->
  <script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>
  <!-- Protomaps' basemap style generator - builds the full MapLibre layer
       list (roads/water/buildings/labels) for a given color flavor. -->
  <script src="https://unpkg.com/@protomaps/basemaps@5/dist/basemaps.js" crossorigin="anonymous"></script>

  <!-- Fonts matching pitkincountyrivers.com: Kameron (headings), Montserrat (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kameron:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /*
      Palette pulled directly from pitkincountyrivers.com (7/28/26):
      --navy and --sage are the site's own computed heading/link colors;
      --leaf and --sky are sampled from the logo's own pixels. Category
      colors beyond the site's single-org palette were added as needed
      to tell the 4 org categories apart on the map.
    */
    :root {
      --navy: #002e4c;
      --sage: #669256;
      --leaf: #6ebe64;
      --sky: #0096dc;
      --ink: #121212;
      --paper: #ffffff;

      /* true brand hues - used for map fills/outlines and legend swatches */
      --cat-water-providers: var(--sky);
      --cat-conservation: var(--leaf);
      --cat-governance: var(--navy);
      --cat-infrastructure: var(--sage);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    header {
      background: var(--navy);
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-family: 'Kameron', serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    header p {
      font-size: 13px;
      opacity: 0.75;
      margin-top: 2px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      padding: 10px 24px;
      background: #f4f7f9;
      border-bottom: 1px solid #e2e8ec;
      font-size: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    #map {
      width: 100%;
      height: 520px;
    }

    .maplibregl-popup-content {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      padding: 14px 16px;
      border-radius: 8px;
      max-width: 260px;
      max-height: min(70vh, 420px);
      overflow-y: auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    /* MapLibre's default close button is a tiny, low-contrast target - make
       it an easy-to-hit circle in the corner instead. */
    .maplibregl-popup-close-button {
      width: 26px;
      height: 26px;
      line-height: 26px;
      font-size: 18px;
      color: var(--navy);
      right: 6px;
      top: 6px;
      border-radius: 50%;
    }

    .maplibregl-popup-close-button:hover {
      background: #f0f4f6;
      color: var(--navy);
    }

    .popup-org-name {
      font-family: 'Kameron', serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--navy);
      margin-bottom: 4px;
    }

    .popup-category {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink);
      background: #f0f4f6;
      padding: 3px 9px 3px 7px;
      border-radius: 99px;
      margin-bottom: 8px;
    }

    .popup-category .legend-swatch,
    .popup-category-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .popup-desc {
      font-size: 13px;
      color: #444;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .popup-link {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
      text-decoration: none;
      border: 1.5px solid var(--navy);
      border-radius: 25px;
      padding: 4px 12px;
    }

    .popup-link:hover { background: var(--navy); color: white; }

    .popup-org-block + .popup-org-block {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e8e8e8;
    }

    .popup-context-block {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--sky);
    }

    .popup-context-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--sky);
      margin-bottom: 3px;
    }

    .map-note {
      font-size: 12px;
      color: #666;
      padding: 8px 16px;
      background: #fff;
      border-top: 1px solid #e8e8e8;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Roaring Fork Watershed Directory</h1>
    <p>Pitkin County Healthy Rivers · Water management organizations across the watershed</p>
  </div>
</header>

<div class="legend" id="legend" aria-label="Organization category legend"></div>

<div id="map" role="region" aria-label="Roaring Fork Watershed map"></div>
<div class="map-note">Proof of concept · 16 organizations across 12 unique service-area boundaries · Roaring Fork/Colorado River watershed reference layers</div>

<script>
  // Register the pmtiles:// protocol once, before the map is created, so
  // MapLibre can read tiles directly out of the single .pmtiles file via
  // HTTP range requests - no tile server involved.
  const pmtilesProtocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', pmtilesProtocol.tile);

  // Self-hosted Protomaps basemap, clipped to the Roaring Fork/West Divide
  // area (see README "Basemap" section for the exact pmtiles extract command
  // used to generate this file). Until data/basemap/roaring-fork.pmtiles
  // exists, this source just renders blank - org/reference layers below are
  // unaffected since those come from our own GeoJSON, not the basemap.
  const BASEMAP_SOURCE = 'protomaps';
  const BASEMAP_FLAVOR = 'grayscale'; // muted on purpose, so category-colored org fills stand out

  // The pmtiles:// protocol needs a fully-qualified URL after it (every
  // Protomaps example shows "pmtiles://https://example.com/x.pmtiles") - a
  // bare relative path fails to parse and the source silently renders
  // nothing. Resolving against location.href here means this works
  // unchanged on localhost AND once deployed under a GitHub Pages subpath.
  const basemapUrl = new URL('data/basemap/roaring-fork.pmtiles', window.location.href).href;

  // Captured separately (not just inlined into the style below) so we can
  // find where roads/labels start in the stack later, and insert the org
  // fill layer just before them - keeping streets and place names fully
  // legible on top instead of getting tinted/obscured underneath our fill.
  // Drop the basemap's own county/local admin boundary layer ('boundaries',
  // kind_detail > 2 - the generic dashed lines for county-level divisions).
  // In this region a lot of those boundaries run along rivers, so at low
  // zoom they read as a dense scatter of dashes tracing every river - easily
  // mistaken for a rendering bug in our own data, but it's just the basemap
  // doing what it's designed to do. We already have our own meaningful
  // reference layers (HUC-8, basin, org boundaries) for context, so generic
  // county lines aren't adding value here - just noise. Keeping
  // 'boundaries_country' (state/national lines - much sparser, still useful
  // context at the zoomed-out view).
  const basemapStyleLayers = basemaps.layers(BASEMAP_SOURCE, basemaps.namedFlavor(BASEMAP_FLAVOR), { lang: 'en' })
    .filter(l => l.id !== 'boundaries');

  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      glyphs: 'https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf',
      sprite: `https://protomaps.github.io/basemaps-assets/sprites/v4/${BASEMAP_FLAVOR}`,
      sources: {
        [BASEMAP_SOURCE]: {
          type: 'vector',
          url: `pmtiles://${basemapUrl}`,
          attribution: '<a href="https://protomaps.com">Protomaps</a> © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }
      },
      layers: basemapStyleLayers
    },
    // Initial view fits the Roaring Fork HUC-8 watershed bounds (computed
    // from data/reference/huc8_roaring_fork.geojson) instead of a fixed
    // center/zoom, so the map opens already framed on the actual watershed
    // rather than an arbitrary point - matches this being a watershed map
    // first, org directory second.
    bounds: [
      [-107.46575, 38.97765], // southwest
      [-106.48108, 39.56394]  // northeast
    ],
    fitBoundsOptions: { padding: 20 },
    attributionControl: true
  });

  // Temporary diagnostic logging - surfaces any style/source error to the
  // console immediately, since MapLibre can fire 'error' synchronously
  // during style validation, before any later-attached listener could catch it.
  map.on('error', (e) => {
    console.error('MAPLIBRE ERROR:', e.error ? (e.error.message || e.error) : e, e);
  });

  // Navigation controls
  map.addControl(new maplibregl.NavigationControl(), 'top-right');

  // Load reference layers + org boundaries together, so we can control stacking order
  // regardless of which fetch finishes first.
  map.on('load', () => {

    // ---- Terrain relief (hillshade) ----
    // Mapterhorn's free Terrarium-encoded elevation PMTiles, extracted the
    // same way as the main basemap (see README "Terrain relief"). Inserted
    // before the basemap's own first layer so it sits at the very bottom of
    // the stack - underneath water/roads/labels, just adding a sense of
    // mountainous relief behind everything else. This file doesn't exist
    // until generated (a separate pull from the main basemap) - until then
    // this source just has nothing to draw and the map looks the same as
    // before, same as how the main basemap behaved before it existed.
    const terrainUrl = new URL('data/basemap/roaring-fork-terrain.pmtiles', window.location.href).href;
    map.addSource('terrain-dem', {
      type: 'raster-dem',
      url: `pmtiles://${terrainUrl}`,
      encoding: 'terrarium',
      tileSize: 256
    });
    map.addLayer({
      id: 'hillshade',
      type: 'hillshade',
      source: 'terrain-dem',
      paint: {
        'hillshade-shadow-color': '#5b5b5b',
        'hillshade-highlight-color': '#ffffff',
        'hillshade-exaggeration': 0.45
      }
    }, basemapStyleLayers.length ? basemapStyleLayers[0].id : undefined);

    const loadJSON = url => fetch(url).then(res => res.json());

    // Normalized data model: boundaries.geojson holds one row per UNIQUE shape
    // (keyed by boundary_id), orgs.json holds one row per org pointing at a
    // boundary_id. Several orgs share a shape (e.g. RFC/RWAPA/PCHR all use the
    // Roaring Fork HUC-8), so we draw each boundary once and join to orgs.json
    // at click-time to list every org tied to that shape - see README
    // "Boundaries vs. orgs (normalized structure)".
    Promise.all([
      loadJSON('data/reference/upper_colorado_region.geojson'),
      loadJSON('data/reference/co_west_slope_basin.geojson'),
      loadJSON('data/reference/huc8_roaring_fork.geojson'),
      loadJSON('data/reference/nhd_rivers.geojson'),
      loadJSON('data/clean/boundaries.geojson'),
      loadJSON('data/clean/orgs.json')
    ]).then(([ucr, basin, huc8, rivers, boundaries, orgs]) => {

      // Group orgs by boundary_id for the click-time join.
      const orgsByBoundary = new Map();
      orgs.forEach(org => {
        if (!orgsByBoundary.has(org.boundary_id)) orgsByBoundary.set(org.boundary_id, []);
        orgsByBoundary.get(org.boundary_id).push(org);
      });

      // Category colors live in CSS (:root) so the legend, popups, and map
      // fills all read from one source of truth - see the "true brand hues"
      // comment in <style>.
      const rootStyle = getComputedStyle(document.documentElement);
      const categoryColors = {
        'Water Providers': rootStyle.getPropertyValue('--cat-water-providers').trim(),
        'Conservation & Advocacy': rootStyle.getPropertyValue('--cat-conservation').trim(),
        'Governance & Policy': rootStyle.getPropertyValue('--cat-governance').trim(),
        'Infrastructure & Planning': rootStyle.getPropertyValue('--cat-infrastructure').trim()
      };
      const fallbackColor = rootStyle.getPropertyValue('--navy').trim();

      // A boundary can carry more than one org, occasionally in different
      // categories (the Roaring Fork HUC-8 covers RFC/Conservation plus
      // RWAPA+PCHR/Governance). Color the shape by its most common category
      // among matched orgs - a proof-of-concept simplification, not meant to
      // erase the mix (the popup still lists every org and its own category).
      function representativeColor(boundaryId) {
        const matched = orgsByBoundary.get(boundaryId) || [];
        if (matched.length === 0) return fallbackColor;
        const counts = {};
        matched.forEach(o => { counts[o.category] = (counts[o.category] || 0) + 1; });
        const topCategory = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
        return categoryColors[topCategory] || fallbackColor;
      }

      // Tag each boundary feature with its color before it hits the map, so
      // paint expressions can just read the property back with ['get', ...].
      boundaries.features.forEach(f => {
        f.properties._categoryColor = representativeColor(f.properties.boundary_id);
      });

      // Build the legend from whichever categories are actually in use -
      // stays correct automatically if a new category shows up later.
      const usedCategories = Array.from(new Set(orgs.map(o => o.category))).sort();
      document.getElementById('legend').innerHTML = usedCategories.map(cat => `
        <div class="legend-item">
          <span class="legend-swatch" style="background:${categoryColors[cat] || fallbackColor}"></span>
          <span>${cat}</span>
        </div>
      `).join('');

      // ---- Upper Colorado Region (HUC-2) - light context outline, fades out on zoom in ----
      map.addSource('upper-colorado-region', { type: 'geojson', data: ucr });
      map.addLayer({
        id: 'ucr-outline',
        type: 'line',
        source: 'upper-colorado-region',
        maxzoom: 9,
        paint: {
          'line-color': '#999999',
          'line-width': 1,
          'line-dasharray': [2, 2],
          'line-opacity': 0.6
        }
      });

      // ---- Colorado West Slope / Colorado River Basin in CO - basin-scale outline ----
      // Recolored to the site's own sky-blue accent (sampled from the logo),
      // so reference/watershed context reads as "water" and stays visually
      // distinct from the category-colored org layer on top of it.
      map.addSource('co-west-slope-basin', { type: 'geojson', data: basin });
      map.addLayer({
        id: 'basin-fill',
        type: 'fill',
        source: 'co-west-slope-basin',
        paint: {
          'fill-color': rootStyle.getPropertyValue('--sky').trim(),
          'fill-opacity': 0.03
        }
      });
      map.addLayer({
        id: 'basin-outline',
        type: 'line',
        source: 'co-west-slope-basin',
        paint: {
          'line-color': rootStyle.getPropertyValue('--sky').trim(),
          'line-width': 1,
          'line-dasharray': [3, 2],
          'line-opacity': 0.7
        }
      });

      // ---- Roaring Fork HUC-8 - local watershed boundary ----
      map.addSource('huc8-roaring-fork', { type: 'geojson', data: huc8 });
      map.addLayer({
        id: 'huc8-fill',
        type: 'fill',
        source: 'huc8-roaring-fork',
        paint: {
          'fill-color': rootStyle.getPropertyValue('--navy').trim(),
          'fill-opacity': 0.04
        }
      });
      map.addLayer({
        id: 'huc8-outline',
        type: 'line',
        source: 'huc8-roaring-fork',
        paint: {
          'line-color': rootStyle.getPropertyValue('--navy').trim(),
          'line-width': 1.5,
          'line-dasharray': [4, 2],
          'line-opacity': 0.6
        }
      });

      // ---- Named rivers/streams (NHD) - watershed context ----
      // Curated set of 12 main-stem rivers + tributaries tied to this
      // project's orgs/caucuses (see data/reference/nhd_rivers.geojson's own
      // caveat field) - not the full NHD network, which runs into the
      // hundreds of minor named/unnamed streams in this area.
      map.addSource('nhd-rivers', { type: 'geojson', data: rivers });
      map.addLayer({
        id: 'rivers-line',
        type: 'line',
        source: 'nhd-rivers',
        paint: {
          'line-color': rootStyle.getPropertyValue('--sky').trim(),
          'line-width': 1.2,
          'line-opacity': 0.85
        }
      });
      map.addLayer({
        id: 'rivers-label',
        type: 'symbol',
        source: 'nhd-rivers',
        layout: {
          'symbol-placement': 'line',
          'text-field': ['get', 'name'],
          'text-font': ['Noto Sans Italic'],
          'text-size': 11,
          'text-letter-spacing': 0.02
        },
        paint: {
          'text-color': rootStyle.getPropertyValue('--sky').trim(),
          'text-halo-color': '#ffffff',
          'text-halo-width': 1.5
        }
      });

      // ---- Org/boundary layer ----
      // One feature per unique shape - orgs sharing a shape (RFC/RWAPA/PCHR,
      // CBRT/CWCB/CRD) are joined in at click-time, not duplicated here.
      // Fill/outline color comes from the _categoryColor tagged onto each
      // feature above, so the map reads as a category legend at a glance.
      map.addSource('boundaries', { type: 'geojson', data: boundaries });

      // The fill (and its hover variant) go IN FRONT of the basemap's water/
      // landcover/building fills, but BEHIND its roads and labels - inserted
      // right before the basemap's first line-type layer. Without this,
      // addLayer() would stack them on top of literally everything,
      // including road lines and place-name text, making the whole basemap
      // hard to read through a tinted overlay. The category-colored outline
      // stays on top (added last, no beforeId) since a thin line doesn't
      // meaningfully obscure anything underneath it.
      const firstRoadLayer = basemapStyleLayers.find(l => l.type === 'line');
      const beforeRoads = firstRoadLayer ? firstRoadLayer.id : undefined;

      map.addLayer({
        id: 'org-fill',
        type: 'fill',
        source: 'boundaries',
        paint: {
          'fill-color': ['get', '_categoryColor'],
          'fill-opacity': 0.15
        }
      }, beforeRoads);

      map.addLayer({
        id: 'org-fill-hover',
        type: 'fill',
        source: 'boundaries',
        paint: {
          'fill-color': ['get', '_categoryColor'],
          'fill-opacity': [
            'case',
            ['boolean', ['feature-state', 'hover'], false],
            0.45,
            0
          ]
        }
      }, beforeRoads);

      // Trying line-offset first for coincident boundaries (e.g. WDWCD's
      // district line running along a municipal line) - nudges each line a
      // couple px to one side so two overlapping boundaries can show as two
      // parallel strips instead of one fully covering the other. Caveat:
      // offset direction depends on each polygon's vertex winding order,
      // which comes from whatever source each file was pulled from (Pitkin
      // GIS/DOLA/BLM/USGS) - not something we control per-feature. This may
      // not resolve every overlapping pair consistently; if it looks worse
      // in places or inconsistent, the fallback is a semi-transparent
      // 'line-opacity' blend instead (see README/chat notes).
      map.addLayer({
        id: 'org-outline',
        type: 'line',
        source: 'boundaries',
        paint: {
          'line-color': ['get', '_categoryColor'],
          'line-width': 1.5,
          'line-offset': 1.5
        }
      });

      // Cursor change on hover - org boundaries and the HUC-8 reference layer
      // are both clickable, so show the pointer over either.
      const interactiveLayers = ['org-fill', 'huc8-fill'];
      interactiveLayers.forEach(layerId => {
        map.on('mouseenter', layerId, () => { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', layerId, () => { map.getCanvas().style.cursor = ''; });
      });

      // Single click handler queries every interactive layer at the clicked
      // point, so overlapping shapes all show up in one popup instead of
      // just whichever layer happens to be on top - e.g. WDWCD's district
      // covers several municipalities, and org boundaries generally sit
      // inside the Roaring Fork HUC-8 reference layer.
      map.on('click', (e) => {
        const hits = map.queryRenderedFeatures(e.point, { layers: interactiveLayers });
        if (hits.length === 0) return;

        // Org boundaries: collect every unique boundary_id hit at this point,
        // then join to every org tied to each one (a single boundary can
        // itself hold multiple orgs, e.g. RFC/RWAPA/PCHR on the HUC-8).
        const boundaryIds = new Set(
          hits.filter(f => f.layer.id === 'org-fill').map(f => f.properties.boundary_id)
        );
        const matchedOrgs = Array.from(boundaryIds).flatMap(id => orgsByBoundary.get(id) || []);

        // Watershed reference layer hit at the same point, if any.
        const huc8Hit = hits.find(f => f.layer.id === 'huc8-fill');

        if (matchedOrgs.length === 0 && !huc8Hit) return;

        const orgsHtml = matchedOrgs.map(org => {
          const website = org.website
            ? `<a class="popup-link" href="https://${org.website}" target="_blank" rel="noopener">Visit website →</a>`
            : '';
          const dotColor = categoryColors[org.category] || fallbackColor;
          return `
            <div class="popup-org-block">
              <div class="popup-org-name">${org.org_name}</div>
              <div class="popup-category">
                <span class="popup-category-dot" style="background:${dotColor}"></span>${org.category}
              </div>
              ${website}
            </div>
          `;
        }).join('');

        const huc8Html = huc8Hit ? `
          <div class="popup-context-block">
            <div class="popup-context-label">Watershed</div>
            <div class="popup-org-name">${huc8Hit.properties.name} watershed</div>
            <div class="popup-desc">HUC-8 ${huc8Hit.properties.huc8} · ${Math.round(huc8Hit.properties.areasqkm).toLocaleString()} km²</div>
          </div>
        ` : '';

        new maplibregl.Popup({ offset: 12, maxWidth: '300px' })
          .setLngLat(e.lngLat)
          .setHTML(orgsHtml + huc8Html)
          .addTo(map);
      });

    }).catch(err => console.error('Failed to load map layers:', err));
  });
</script>

</body>
</html>
